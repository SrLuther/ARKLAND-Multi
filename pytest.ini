[pytest]
# Suites oficiais. `python -m pytest` na raiz roda ambas.
testpaths = tests plugin/arkshop_web/tests
# Somente test_*.py: scripts como tools/_rt_test.py e módulos de produção
# como src/pages/broadcast_test.py / cluster_travel_test.py NÃO são testes.
python_files = test_*.py
# O plugin doctest do pytest coleta qualquer `test*.txt` (doctest-glob padrão).
# Existem saídas de execução (`test_app_output.txt`, `test_app_result.txt`, ...)
# em UTF-16 que quebravam a coleta com UnicodeDecodeError.
addopts = -p no:doctest
norecursedirs = .* build dist node_modules venv .venv .python .python-full __pycache__ artifacts
